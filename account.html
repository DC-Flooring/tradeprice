<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0A09">
  <meta name="color-scheme" content="dark">
  <title>Your account | DC Trade</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DC Trade">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600&amp;family=Barlow+Condensed:wght@700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap site-header__row">
      <a class="brand" href="app.html" aria-label="DC Flooring trade, your home screen">
        <img src="assets/logo.png" alt="DC Flooring: carpet, vinyl and more" width="659" height="183">
      </a>
      <a class="avatar" href="account.html" data-user-initials aria-label="Your account">CW</a>
    </div>
  </header>

  <!-- Placeholder page: account settings are still to be built -->
  <main id="main" class="apply">
    <div class="narrow">
      <a class="back-link" href="app.html">Home</a>
      <h1 class="page-title" data-user-fullname>Craig Wilson</h1>
      <p class="page-lede" data-user-business>Wilson Flooring</p>
      <dl class="account-list">
        <div><dt>Account number</dt><dd class="num" data-user-account>DC-1042</dd></div>
        <div><dt>Tier</dt><dd data-user-tier>Trade Plus</dd></div>
      </dl>
      <p class="coming-soon">Coming soon: your details, text and email preferences, and who can use this account.</p>
      <div class="account-actions">
        <a class="btn btn--outline btn--lg btn--block" href="index.html" data-sign-out>Sign out</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="ruler" aria-hidden="true"></div>
      <div class="site-footer__row">
        <img class="site-footer__logo" src="assets/logo.png" alt="DC Flooring: carpet, vinyl and more" width="659" height="183" loading="lazy">
        <div class="site-footer__legal">
          <p>DC Flooring Ltd · [Company no.] · [VAT no.]</p>
          <p>Prices shown ex VAT. Trade accounts subject to approval.</p>
        </div>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/demo-user.js?v=5"></script>
  <script src="js/main.js?v=5" defer></script>
</body>
</html>
